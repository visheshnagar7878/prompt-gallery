<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Vishesh Nagar</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            600: '#4f46e5', // Indigo-600
                            500: '#6366f1',
                        },
                        slate: {
                            850: '#151b2e',
                            900: '#0f172a',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Grid BG -->
    <div
        class="fixed inset-0 -z-10 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]">
    </div>
    <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_center,rgba(79,70,229,0.1),rgba(0,0,0,0))]"></div>

    <div class="w-full max-w-lg">
        <!-- Main Card -->
        <div class="glass-panel rounded-2xl shadow-2xl p-8 md:p-10 relative overflow-hidden">

            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="h-12 w-12 bg-brand-600 rounded-xl flex items-center justify-center text-white text-xl font-bold mx-auto mb-4 shadow-lg shadow-brand-500/30">
                    V
                </div>
                <h1 class="font-display text-2xl font-bold text-white mb-2">Admin Dashboard</h1>
                <p class="text-slate-400 text-sm">Access your AI Gallery controls</p>
            </div>

            <!-- Login Section -->
            <div id="loginSection" class="active">
                <!-- Error Message -->
                <div id="loginError"
                    class="hidden mb-6 p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">
                </div>

                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email
                            Address</label>
                        <input type="email" id="adminEmail"
                            class="w-full px-4 py-3 rounded-lg bg-slate-900/50 border border-white/10 text-white placeholder-slate-500 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all"
                            placeholder="name@example.com" required>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="adminPassword"
                            class="w-full px-4 py-3 rounded-lg bg-slate-900/50 border border-white/10 text-white placeholder-slate-500 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all"
                            placeholder="••••••••" required>
                    </div>

                    <button type="submit"
                        class="w-full py-3.5 px-6 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold shadow-lg shadow-brand-600/25 transition-all">
                        Sign In
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-white transition-colors">
                        ← Return to Gallery
                    </a>
                </div>
            </div>

            <!-- Upload Section -->
            <div id="uploadSection" class="hidden">
                <!-- Messages -->
                <div id="successMsg"
                    class="hidden mb-6 p-4 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm text-center font-medium">
                </div>
                <div id="uploadError"
                    class="hidden mb-6 p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center font-medium">
                </div>

                <form id="uploadForm" class="space-y-6">
                    <!-- Upload Button -->
                    <button type="button" id="uploadWidget"
                        class="w-full py-6 px-6 border border-dashed border-white/10 rounded-xl bg-white/5 hover:bg-white/10 hover:border-brand-500/50 transition-all group flex flex-col items-center gap-3 cursor-pointer">
                        <div
                            class="h-10 w-10 rounded-full bg-slate-800 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                            📤</div>
                        <span class="font-medium text-slate-300 group-hover:text-white">Upload Image</span>
                    </button>

                    <!-- Preview Area -->
                    <div id="preview" class="empty:hidden rounded-lg overflow-hidden border border-white/10"></div>
                    <div id="imageUrl"
                        class="hidden text-xs text-slate-500 bg-slate-900 p-3 rounded-lg break-all border border-white/5">
                    </div>

                    <!-- Prompt Field -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Prompt
                            Details</label>
                        <textarea id="promptText" rows="4"
                            class="w-full px-4 py-3 rounded-lg bg-slate-900/50 border border-white/10 text-white placeholder-slate-500 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition-all resize-y min-h-[100px]"
                            placeholder="Enter the generation prompt..." required></textarea>
                    </div>

                    <!-- Actions -->
                    <button type="submit" id="saveBtn" disabled
                        class="w-full py-3.5 px-6 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold transition-all shadow-lg shadow-brand-600/25 disabled:opacity-50 disabled:cursor-not-allowed">
                        Save to Gallery
                    </button>

                    <button type="button" onclick="logout()"
                        class="w-full py-3 px-6 rounded-lg bg-slate-800 text-slate-400 hover:text-white font-medium hover:bg-slate-700 transition-colors">
                        Sign Out
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-white transition-colors">
                        ← Return to Gallery
                    </a>
                </div>
            </div>

        </div>

        <p class="text-center text-slate-600 text-xs mt-6">
            &copy; 2025 Vishesh Nagar. All rights reserved.
        </p>
    </div>

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- Firebase SDK & Admin Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBeJAFrLVOPXvRVh3uHdwUtayktoY4tZIQ",
            authDomain: "prompt-gallery-5ee9e.firebaseapp.com",
            projectId: "prompt-gallery-5ee9e",
            storageBucket: "prompt-gallery-5ee9e.firebasestorage.app",
            messagingSenderId: "201682624108",
            appId: "1:201682624108:web:513ebfb5c317e939c48249",
            measurementId: "G-RRWMXCENPJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CLOUDINARY_CLOUD_NAME = 'dbptivarx';
        const CLOUDINARY_UPLOAD_PRESET = 'prompt_gallery';

        let uploadedImageUrl = '';

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                toggleSections('upload');
            } else {
                toggleSections('login');
            }
        });

        function toggleSections(section) {
            const loginSection = document.getElementById('loginSection');
            const uploadSection = document.getElementById('uploadSection');

            if (section === 'upload') {
                loginSection.classList.add('hidden');
                uploadSection.classList.remove('hidden');
            } else {
                loginSection.classList.remove('hidden');
                uploadSection.classList.add('hidden');
            }
        }

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showError('loginError', 'Invalid credentials.');
                console.error('Login error:', error);
            }
        });

        // Initialize Cloudinary
        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME,
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'url'],
            multiple: false,
            maxImageFileSize: 10000000,
            clientAllowedFormats: ['jpg', 'png', 'webp'],
            folder: 'gallery'
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                uploadedImageUrl = result.info.secure_url;

                document.getElementById('preview').innerHTML =
                    `<img src="${uploadedImageUrl}" alt="Uploaded" class="w-full h-auto object-cover">`;

                const urlDiv = document.getElementById('imageUrl');
                urlDiv.classList.remove('hidden');
                urlDiv.textContent = `Image ready`;

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = false;
            }
            if (error) {
                showError('uploadError', 'Upload failed');
            }
        });

        document.getElementById('uploadWidget').addEventListener('click', () => {
            myWidget.open();
        });

        // Save to Firestore
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const prompt = document.getElementById('promptText').value.trim();
            const saveBtn = document.getElementById('saveBtn');

            if (!uploadedImageUrl || !prompt) {
                showError('uploadError', 'Image and prompt required');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                await addDoc(collection(db, 'gallery'), {
                    imageUrl: uploadedImageUrl,
                    prompt: prompt,
                    timestamp: serverTimestamp()
                });

                showSuccess('Published to Gallery');

                // Reset
                document.getElementById('promptText').value = '';
                document.getElementById('preview').innerHTML = '';
                document.getElementById('imageUrl').classList.add('hidden');
                uploadedImageUrl = '';
                saveBtn.textContent = 'Save to Gallery';

            } catch (error) {
                showError('uploadError', 'Error saving');
                console.error(error);
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save to Gallery';
            }
        });

        window.logout = async () => {
            try { await signOut(auth); } catch (e) { console.error(e); }
        };

        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.classList.remove('hidden');
            setTimeout(() => successMsg.classList.add('hidden'), 5000);
        }

        function showError(elementId, message) {
            const errorMsg = document.getElementById(elementId);
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
            setTimeout(() => errorMsg.classList.add('hidden'), 5000);
        }
    </script>
</body>

</html>
